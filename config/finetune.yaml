logs_root_dir: /data2/personal/swc/exp_logs/preset-gen-vae
verbosity: 1
allow_erase_run: False

train:
  dataset: surge
  start_epoch: 0
  n_epochs: 200
  save_period: 10
  eval_period: 5

model:
  name: ft_surge-discrete-lr_2e-6
  run_name: kfold0-s1
  saved_path: ft-from_200ep-alpha_1-eval_surge/kfold0-s1

optim:
  initial_lr: 0.000002
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  gamma: 0.995
  warmup_epochs: 6
  warmup_start_factor: 0.1

loss:
  param: False
  normalize_losses: True
  cat_softmax_t: 0.2
  label_smoothing: True
  pg: True
  audio_eval_n_workers: 16
  pg_logp_threshold: 1.0
  pg_coef:
    s_value: 0.0
    e_value: 1.0
    s_epoch: 0
    e_epoch: 200
